[project]
name = "harness"
version = "0.1.0"
description = "Short text tools that let a small local model drive a hidden browser"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "playwright",
    "trafilatura",
    "adblock",
    "rank-bm25",
    "httpx",
    "pytest",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# `harness/browser/elements.py` reads `elements.js` at import time. Without this
# the wheel ships only .py files and `import harness` fails once installed.
[tool.setuptools.packages.find]
include = ["harness*"]

[tool.setuptools.package-data]
"harness.browser" = ["*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
