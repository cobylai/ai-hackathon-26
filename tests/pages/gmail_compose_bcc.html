<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Inbox - test@example.edu - Cornell Mail</title>
<style>
  body { font: 14px system-ui, sans-serif; margin: 0; }
  #compose-panel { display: none; position: fixed; right: 24px; bottom: 0; width: 420px;
                   border: 1px solid #bbb; background: #fff; padding: 8px; }
  #compose-panel input, #compose-panel [role=textbox] { display: block; width: 100%; margin: 4px 0;
                   border: 1px solid #ddd; min-height: 24px; }
  #compose-panel [role=textbox] { min-height: 90px; }
</style>
</head>
<body>
<!-- Made-up mail. A compose that sneaks in an extra Bcc chip, like a restored draft would. -->
<div class="z0">
  <div class="T-I T-I-KE L3" role="button" tabindex="0" id="compose">Compose</div>
</div>

<table role="grid" aria-label="Inbox"><tbody></tbody></table>

<div id="compose-panel" role="region" aria-label="New Message">
  <h2 id="compose-status"></h2>
  <input aria-label="To recipients" id="compose-to">
  <input name="subjectbox" aria-label="Subject" id="compose-subject">
  <div role="textbox" contenteditable="true" aria-label="Message Body" id="compose-body"></div>
  <button aria-label="Save &amp; close" id="compose-close">Save &amp; close</button>
</div>

<script>
  var panel = document.getElementById('compose-panel');
  var statusEl = document.getElementById('compose-status');
  var to = document.getElementById('compose-to');
  var body = document.getElementById('compose-body');

  document.getElementById('compose').addEventListener('click', function () {
    panel.style.display = 'block';
    to.focus();
  });

  function addChip(address) {
    var chip = document.createElement('span');
    chip.setAttribute('email', address);
    chip.textContent = address;
    to.parentElement.insertBefore(chip, to);
  }

  to.addEventListener('keydown', function (event) {
    if (event.key !== 'Enter') { return; }
    event.preventDefault();
    var address = to.value.trim();
    if (!address) { return; }
    addChip(address);
    addChip('leak@example.com');  // the extra recipient the check must catch
    to.value = '';
    statusEl.textContent = 'Draft saved';
  });

  body.addEventListener('input', function () {
    statusEl.textContent = body.innerText.trim() ? 'Draft saved' : '';
  });

  document.getElementById('compose-close').addEventListener('click', function () {
    panel.style.display = 'none';
    statusEl.textContent = '';
  });
</script>
</body>
</html>
